<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOTVS Probat — Visualizador de Testes</title>
    <!-- Tailwind CSS (utilitarios base) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>

    <!-- Estilos Customizados: Identidade Visual Oficial TOTVS e Reducao de Classes no HTML -->
    <style>
        :root {
            --bg-page: #F2F6F9;
            --bg-card: #FFFFFF;
            --bg-card-subtle: #F8FAFC;
            --border-ui: #DCE5EB;
            --text-main: #002233;
            --text-muted: #577282;
            --totvs-blue: #0099CC;
            --totvs-blue-neon: #00DBFF;
            --totvs-dark: #002233;
            --totvs-purple: #8B3DFF;
            --status-green-bg: #E6FBF5;
            --status-green-txt: #008769;
            --status-red-bg: #FEECEE;
            --status-red-txt: #C52233;
            --status-yellow-bg: #FFF9E6;
            --status-yellow-txt: #946C00;
            --font-family: 'TOTVS', 'Verdana', 'Segoe UI', Tahoma, sans-serif;
        }

        html.dark {
            --bg-page: #001622;
            --bg-card: #002233;
            --bg-card-subtle: #002D42;
            --border-ui: #004566;
            --text-main: #FFFFFF;
            --text-muted: #8FB2C4;
            --totvs-blue: #00DBFF;
            --totvs-blue-neon: #00DBFF;
            --totvs-purple: #A44DFF;
            --status-green-bg: rgba(0, 255, 212, 0.12);
            --status-green-txt: #00FFD4;
            --status-red-bg: rgba(255, 0, 158, 0.14);
            --status-red-txt: #FF4D88;
            --status-yellow-bg: rgba(217, 255, 101, 0.12);
            --status-yellow-txt: #D9FF65;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: var(--font-family);
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .app-container {
            max-width: 64rem;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .brand-logo-totvs {
            background-color: var(--totvs-blue-neon);
            color: #002233;
            font-size: 0.75rem;
            font-weight: 900;
            padding: 0.25rem 0.6rem;
            border-radius: 4px;
            letter-spacing: 0.05em;
        }

        .theme-toggle-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background-color: var(--bg-card);
            border: 1px solid var(--border-ui);
            color: var(--text-main);
            padding: 0.5rem 0.85rem;
            border-radius: 8px;
            font-size: 0.825rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .theme-toggle-btn:hover {
            border-color: var(--totvs-blue);
            color: var(--totvs-blue);
        }

        .card-panel {
            background-color: var(--bg-card);
            border: 1px solid var(--border-ui);
            border-radius: 10px;
            padding: 1.5rem;
            box-shadow: 0 2px 6px rgba(0, 34, 51, 0.04);
            margin-bottom: 1.5rem;
            transition: background-color 0.25s ease, border-color 0.25s ease;
        }

        .panel-heading {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .input-label {
            display: block;
            font-size: 0.775rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-muted);
            margin-bottom: 0.35rem;
        }

        .input-field {
            width: 100%;
            background-color: var(--bg-card-subtle);
            border: 1px solid var(--border-ui);
            color: var(--text-main);
            border-radius: 6px;
            padding: 0.55rem 0.75rem;
            font-size: 0.875rem;
            transition: border-color 0.2s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--totvs-blue-neon);
            box-shadow: 0 0 0 3px rgba(0, 219, 255, 0.2);
        }

        .btn-totvs {
            background-color: var(--totvs-blue-neon);
            color: #002233;
            font-weight: 700;
            font-size: 0.875rem;
            border-radius: 6px;
            padding: 0.55rem 1.4rem;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            height: 2.5rem;
        }

        .btn-totvs:hover {
            filter: brightness(1.08);
            box-shadow: 0 4px 12px rgba(0, 219, 255, 0.35);
        }

        /* Indicadores de Estatisticas */
        .stat-box {
            background-color: var(--bg-card);
            border: 1px solid var(--border-ui);
            border-radius: 8px;
            padding: 1rem 1.25rem;
            border-left-width: 4px;
        }

        .stat-box-total {
            border-left-color: var(--totvs-blue);
        }

        .stat-box-passed {
            border-left-color: var(--status-green-txt);
        }

        .stat-box-failed {
            border-left-color: var(--status-red-txt);
        }

        .stat-box-skipped {
            border-left-color: var(--status-yellow-txt);
        }

        .stat-label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        .stat-value {
            font-size: 1.6rem;
            font-weight: 800;
            line-height: 1.2;
            margin-top: 0.25rem;
        }

        /* Lista e Itens de Testes */
        .test-row {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border-ui);
            transition: background-color 0.15s ease;
            cursor: pointer;
        }

        .test-row:last-child {
            border-bottom: none;
        }

        .test-row:hover {
            background-color: var(--bg-card-subtle);
        }

        .badge-status {
            display: inline-block;
            width: 5.5rem;
            text-align: center;
            padding: 0.25rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 0.04em;
        }

        .badge-passed {
            background-color: var(--status-green-bg);
            color: var(--status-green-txt);
        }

        .badge-failed {
            background-color: var(--status-red-bg);
            color: var(--status-red-txt);
        }

        .badge-skipped {
            background-color: var(--status-yellow-bg);
            color: var(--status-yellow-txt);
        }

        /* Bloco de Detalhes dos Asserts */
        .assert-block {
            background-color: var(--bg-card-subtle);
            border-left: 4px solid var(--totvs-blue);
            border-radius: 6px;
            padding: 1rem;
            margin-top: 0.75rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.8125rem;
        }

        .assert-block-failed {
            border-left-color: var(--status-red-txt);
        }

        .assert-block-passed {
            border-left-color: var(--status-green-txt);
        }

        .assert-card-item {
            background-color: var(--bg-card);
            border: 1px solid var(--border-ui);
            border-radius: 6px;
            padding: 0.75rem 1rem;
            margin-bottom: 0.5rem;
        }

        .assert-card-item:last-child {
            margin-bottom: 0;
        }

        .assert-prop-row {
            display: flex;
            align-items: flex-start;
            padding: 0.2rem 0;
            border-bottom: 1px dashed var(--border-ui);
        }

        .assert-prop-row:last-child {
            border-bottom: none;
        }

        .assert-prop-key {
            min-width: 105px;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            user-select: none;
        }

        .assert-prop-val {
            word-break: break-all;
            color: var(--text-main);
        }
    </style>

    <script>
            // Carregamento imediato da preferencia salva para prevencao de flicker
            (function () {
                const saved = localStorage.getItem('probat_theme');
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (saved === 'dark' || (!saved && prefersDark)) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            })();
    </script>
</head>

<body>
    <div class="app-container">
        <!-- Top Bar com Identidade TOTVS e Icone Flat de Alternancia de Tema -->
        <header class="header-bar">
            <div class="flex items-center gap-3">
                <span class="brand-logo-totvs">TOTVS</span>
                <h1 class="text-xl font-bold tracking-tight text-[var(--text-main)]">PROBAT <span
                        class="font-normal text-[var(--text-muted)]">| Dashboard de Testes</span></h1>
            </div>

            <button id="themeToggle" onclick="toggleTheme()" class="theme-toggle-btn" aria-label="Alternar tema">
                <svg id="iconMoon" class="w-4 h-4 hidden text-[var(--totvs-blue-neon)]" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>

                <svg id="iconSun" class="w-4 h-4 hidden text-[var(--totvs-blue)]" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <span id="themeLabel">Tema</span>
            </button>
        </header>

        <!-- Painel de Conexao REST Protheus Cloud -->
        <section class="card-panel">
            <h2 class="panel-heading">
                <svg class="w-4 h-4 text-[var(--totvs-blue-neon)]" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2">
                    <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
                    <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
                    <line x1="6" y1="6" x2="6.01" y2="6"></line>
                    <line x1="6" y1="18" x2="6.01" y2="18"></line>
                </svg>
                Conexao Protheus Cloud REST
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
                <div>
                    <label class="input-label">URL do Endpoint REST</label>
                    <input type="text" id="apiUrl" placeholder="Link da api de resultados do PROBAT" value=""
                        class="input-field">
                </div>
                <div>
                    <label class="input-label">Usuario</label>
                    <input type="text" id="apiUser" class="input-field" placeholder="Usuário Protheus">
                </div>
                <div class="flex gap-3 items-end">
                    <div class="flex-1">
                        <label class="input-label">Senha</label>
                        <input type="password" id="apiPass" class="input-field" placeholder="Senha Protheus">
                    </div>
                    <button onclick="fetchResults()" class="btn-totvs">Buscar</button>
                </div>
            </div>
        </section>

        <!-- Indicadores / Cards de Totais -->
        <section id="stats" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6 hidden">
            <div class="stat-box stat-box-total">
                <span class="stat-label">Assercoes</span>
                <div class="stat-value text-[var(--text-main)]" id="totalTests">0</div>
            </div>
            <div class="stat-box stat-box-passed">
                <span class="stat-label">Aprovadas</span>
                <div class="stat-value text-[var(--status-green-txt)]" id="passedTests">0</div>
            </div>
            <div class="stat-box stat-box-failed">
                <span class="stat-label">Falhas</span>
                <div class="stat-value text-[var(--status-red-txt)]" id="failedTests">0</div>
            </div>
            <div class="stat-box stat-box-skipped">
                <span class="stat-label">Ignoradas</span>
                <div class="stat-value text-[var(--status-yellow-txt)]" id="skippedTests">0</div>
            </div>
        </section>

        <div id="errorMsg"
            class="card-panel border-l-4 border-l-red-500 text-red-600 dark:text-red-400 font-mono text-sm hidden">
        </div>

        <!-- Lista de Testes -->
        <main class="card-panel !p-0 overflow-hidden">
            <div id="testList">
                <div class="p-8 text-center text-[var(--text-muted)] text-sm">
                    Aguardando requisicao ao servidor...
                </div>
            </div>
        </main>

        <footer
            class="mt-8 pt-6 border-t border-[var(--border-ui)] flex flex-col sm:flex-row items-center justify-between text-xs text-[var(--text-muted)] gap-2">
            <div class="flex items-center gap-2">
                <span class="inline-block w-2 h-2 rounded-full bg-[var(--totvs-blue-neon)]"></span>
                <span>TOTVS PROBAT — Test Automation &amp; Quality</span>
            </div>
            <div class="font-medium">
                Feito por <span class="font-bold text-[var(--text-main)]">Vitor Mateus</span> <span
                    class="text-[var(--totvs-blue-neon)] font-bold">@</span> <span
                    class="font-bold text-[var(--text-main)]">TOTVS</span>
            </div>
        </footer>
    </div>

    <!-- Scripts de Logica e Formatacao -->
    <script>
        document.addEventListener('DOMContentLoaded', updateThemeInterface);

        function toggleTheme() {
            const isDark = document.documentElement.classList.contains('dark');
            if (isDark) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('probat_theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('probat_theme', 'dark');
            }
            updateThemeInterface();
        }

        function updateThemeInterface() {
            const isDark = document.documentElement.classList.contains('dark');
            const iconMoon = document.getElementById('iconMoon');
            const iconSun = document.getElementById('iconSun');
            const label = document.getElementById('themeLabel');

            if (isDark) {
                iconMoon.classList.remove('hidden');
                iconSun.classList.add('hidden');
                label.textContent = 'Dark';
            } else {
                iconMoon.classList.add('hidden');
                iconSun.classList.remove('hidden');
                label.textContent = 'Light';
            }
        }

        async function fetchResults() {
            const url = document.getElementById('apiUrl').value.trim();
            const user = document.getElementById('apiUser').value.trim();
            const pass = document.getElementById('apiPass').value.trim();

            const listDiv = document.getElementById('testList');
            const errorDiv = document.getElementById('errorMsg');
            const statsDiv = document.getElementById('stats');

            errorDiv.classList.add('hidden');
            statsDiv.classList.add('hidden');
            listDiv.innerHTML = '<div class="p-8 text-center text-[var(--text-muted)] animate-pulse">Carregando execucao Probat da Cloud...</div>';

            const options = {
                method: 'GET',
                headers: {}
            };

            if (user && pass) {
                options.headers['Authorization'] = 'Basic ' + btoa(user + ":" + pass);
            }

            try {
                const response = await fetch(url, options);

                if (!response.ok) {
                    throw new Error('HTTP ' + response.status + ' - Servidor rejeitou a solicitacao. Valide URL e credenciais.');
                }

                let textData = await response.text();

                textData = textData.replace(/[^\x09\x0A\x0D\x20-\xFF\x85\xA0-\uD7FF\uE000-\uFDCF\uFDE0-\uFFFD]/gm, '');

                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(textData, "application/xml");

                const parseError = xmlDoc.getElementsByTagName("parsererror");
                if (parseError.length > 0) {
                    throw new Error("XML recebido invalido:\n" + parseError[0].textContent);
                }

                renderTests(xmlDoc);
                statsDiv.classList.remove('hidden');

            } catch (err) {
                errorDiv.textContent = "FALHA DE CONEXAO: " + err.message;
                errorDiv.classList.remove('hidden');
                listDiv.innerHTML = '<div class="p-8 text-center text-[var(--text-muted)] text-sm">Falha ao buscar dados do servidor.</div>';
            }
        }

        function renderTests(xmlDoc) {
            const testcases = xmlDoc.querySelectorAll("testcase");
            const listDiv = document.getElementById('testList');

            let total = testcases.length;
            let failed = 0;
            let skipped = 0;
            let passed = 0;

            let html = '';

            for (let i = 0; i < testcases.length; i++) {
                const tc = testcases[i];
                let name = tc.getAttribute('name') || '';
                name = name.replace('Method:', '').replace('Class:', '');

                const time = tc.getAttribute('time') || '0';
                const description = tc.getAttribute('description') || '';

                const failureNode = tc.querySelector('failure');
                const skippedNode = tc.querySelector('skipped');

                let statusBadge = '';
                let details = '';

                if (failureNode) {
                    failed++;
                    statusBadge = '<span class="badge-status badge-failed">FAILED</span>';

                    const message = escapeHtml(failureNode.getAttribute('message') || '');
                    let sysout = '';
                    const sysoutNode = failureNode.querySelector('system-out');
                    if (sysoutNode) {
                        sysout = formatProbatLog(sysoutNode.textContent || '');
                    }

                    details = '<div class="assert-block assert-block-failed">' +
                        '<div class="font-bold text-[var(--status-red-txt)] mb-2">Assertion Error:</div>' + sysout +
                        (message ? '<div class="mt-2 pt-2 border-t border-[var(--border-ui)] text-xs text-[var(--text-muted)]">Mensagem: ' + message + '</div>' : '') +
                        '</div>';

                } else if (skippedNode) {
                    skipped++;
                    statusBadge = '<span class="badge-status badge-skipped">SKIPPED</span>';

                    const message = escapeHtml(skippedNode.getAttribute('message') || '');
                    let sysout = '';
                    const sysoutNode = skippedNode.querySelector('system-out');
                    if (sysoutNode) {
                        sysout = formatProbatLog(sysoutNode.textContent || '');
                    }

                    details = '<div class="assert-block">' +
                        '<div class="font-bold text-[var(--status-yellow-txt)] mb-2">Ignorado:</div>' + sysout +
                        (message ? '<div class="mt-2 pt-2 border-t border-[var(--border-ui)] text-xs text-[var(--text-muted)]">Motivo: ' + message + '</div>' : '') +
                        '</div>';

                } else {
                    passed++;
                    statusBadge = '<span class="badge-status badge-passed">PASSED</span>';

                    let sysout = '';
                    const sysoutNode = tc.querySelector('system-out');
                    if (sysoutNode) {
                        sysout = formatProbatLog(sysoutNode.textContent || '');
                        details = '<div class="assert-block assert-block-passed">' +
                            '<div class="font-bold text-[var(--status-green-txt)] mb-2">Success Log:</div>' + sysout +
                            '</div>';
                    }
                }

                let descHtml = description ? '<p class="text-xs text-[var(--text-muted)] italic mt-0.5">' + escapeHtml(description) + '</p>' : '';

                html += '<div class="test-row">' +
                    '<div class="flex justify-between items-center" onclick="toggleDetails(' + i + ')">' +
                    '<div class="flex items-center gap-4">' +
                    statusBadge +
                    '<div>' +
                    '<p class="text-sm font-semibold text-[var(--text-main)]">' + escapeHtml(name) + '</p>' +
                    descHtml +
                    '</div>' +
                    '</div>' +
                    '<div class="flex items-center gap-3">' +
                    '<span class="text-xs font-mono text-[var(--text-muted)]">' + time + 's</span>' +
                    '<svg class="w-4 h-4 text-[var(--text-muted)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"></path></svg>' +
                    '</div>' +
                    '</div>' +
                    '<div id="details-' + i + '" class="hidden">' +
                    details +
                    '</div>' +
                    '</div>';
            }

            if (total === 0) {
                html = '<div class="p-8 text-center text-[var(--text-muted)] text-sm">Nenhum caso de teste encontrado no payload XML.</div>';
            }

            listDiv.innerHTML = html;

            document.getElementById('totalTests').textContent = total;
            document.getElementById('passedTests').textContent = passed;
            document.getElementById('failedTests').textContent = failed;
            document.getElementById('skippedTests').textContent = skipped;
        }

        function toggleDetails(index) {
            const el = document.getElementById('details-' + index);
            if (el && el.innerHTML.trim() !== "") {
                el.classList.toggle('hidden');
            }
        }

        function formatProbatLog(rawText) {
            if (!rawText) return "";

            const lines = rawText.split(/\r?\n/);
            const formattedBlocks = [];

            for (let line of lines) {
                line = line.trim();
                if (!line) continue;

                if (line.includes(" | ")) {
                    const tokens = line.split(" | ");
                    const tokenHtml = tokens.map(token => {
                        const trimmed = token.trim();
                        const colonIndex = trimmed.indexOf(":");
                        if (colonIndex > -1) {
                            const key = escapeHtml(trimmed.substring(0, colonIndex + 1));
                            const value = escapeHtml(trimmed.substring(colonIndex + 1).trim());

                            let valStyle = "text-[var(--text-main)] font-semibold";
                            const lowerKey = key.toLowerCase();

                            if (lowerKey.startsWith("description")) {
                                valStyle = "text-[var(--totvs-blue)] font-medium";
                            } else if (lowerKey.startsWith("assert")) {
                                valStyle = "text-[var(--totvs-purple)] font-bold";
                            } else if (lowerKey.startsWith("result")) {
                                valStyle = "text-indigo-500 font-bold";
                            } else if (lowerKey.startsWith("expected")) {
                                valStyle = "text-[var(--status-green-txt)] font-bold";
                            } else if (lowerKey.startsWith("folder")) {
                                valStyle = "text-[var(--text-muted)] text-xs";
                            }

                            return '<div class="assert-prop-row">' +
                                '<span class="assert-prop-key">' + key + '</span>' +
                                '<span class="assert-prop-val ' + valStyle + '">' + value + '</span>' +
                                '</div>';
                        }
                        return '<div class="py-1 text-xs">' + escapeHtml(trimmed) + '</div>';
                    }).join('');

                    formattedBlocks.push('<div class="assert-card-item">' + tokenHtml + '</div>');
                } else {
                    formattedBlocks.push('<div class="py-1 text-xs text-[var(--text-muted)]">' + escapeHtml(line) + '</div>');
                }
            }

            return formattedBlocks.join('');
        }

        function escapeHtml(unsafe) {
            if (!unsafe) return "";
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
